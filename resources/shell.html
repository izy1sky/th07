<!doctype html>
<html>
    <head>
        <title>東方妖々夢　〜 Perfect Cherry Blossom</title>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
        <script src="toy-bridge.js"></script>
        <style>
            html,
            body {
                margin: 0;
                background: #000;
            }

            /* Loading screen: covers the black canvas until the game draws its first frame,
               so a slow download doesn't look like a broken page. */
            #loader {
                position: fixed;
                inset: 0;
                z-index: 50;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(ellipse at center, #2a0a1c 0%, #000 70%);
                color: #ccc;
                font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
                transition: opacity 0.5s;
            }
            #loader.gone {
                opacity: 0;
                pointer-events: none;
            }
            .ld-box {
                width: min(420px, calc(100vw - 32px));
                text-align: center;
            }
            .ld-title {
                font-size: 30px;
                letter-spacing: 0.12em;
                color: #f6dbe6;
                font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
            }
            .ld-sub {
                margin-top: 4px;
                font-size: 12px;
                letter-spacing: 0.08em;
                color: #a77089;
            }
            .ld-bar {
                position: relative;
                margin: 28px 0 12px;
                height: 6px;
                border-radius: 3px;
                background: rgba(255, 255, 255, 0.1);
                overflow: hidden;
            }
            #ld-fill {
                height: 100%;
                width: 0;
                border-radius: 3px;
                background: linear-gradient(90deg, #b03a6a, #f3a0c0);
                transition: width 0.25s;
            }
            /* No measurable progress (engine start-up, first frame): a sliding band instead. */
            .ld-bar.busy #ld-fill {
                width: 30%;
                animation: ld-slide 1.2s ease-in-out infinite;
            }
            @keyframes ld-slide {
                from {
                    transform: translateX(-100%);
                }
                to {
                    transform: translateX(340%);
                }
            }
            #ld-step {
                font-size: 15px;
                color: #e6e6e6;
            }
            #ld-detail {
                margin-top: 6px;
                min-height: 1.4em;
                font-size: 12px;
                color: #999;
                font-variant-numeric: tabular-nums;
            }
            #ld-note {
                margin-top: 18px;
                font-size: 12px;
                color: #777;
                line-height: 1.6;
            }
            #loader.error #ld-step {
                color: #ff8a8a;
            }
            #ld-retry {
                margin-top: 16px;
                padding: 8px 22px;
                font: inherit;
                font-size: 14px;
                color: #fff;
                background: #b03a6a;
                border: 0;
                border-radius: 4px;
                cursor: pointer;
            }

            .canvas {
                padding-left: 0;
                padding-right: 0;
                margin-left: auto;
                margin-right: auto;
                display: block;
                padding: 0;
                margin: auto;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                object-fit: contain;
                width: 100vw;
                height: 100vh;
            }

            #toy-panel {
                position: fixed;
                z-index: 9998;
                width: 320px;
                max-height: 70vh;
                overflow-y: auto;
                background: rgba(8, 12, 20, 0.92);
                color: #cfc;
                font: 12px/1.5 monospace;
                border: 1px solid #366;
                border-radius: 6px;
                padding: 8px 10px;
                box-sizing: border-box;
                display: none;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
            }

            .toy-panel-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: bold;
                color: #9f9;
                margin-bottom: 6px;
            }

            #toy-panel-close {
                background: none;
                border: 1px solid #366;
                color: #9f9;
                cursor: pointer;
                font: 14px monospace;
                line-height: 1;
                padding: 2px 6px;
            }

            .toy-actions {
                display: flex;
                gap: 6px;
                margin: 6px 0;
            }

            .toy-actions button {
                background: #123;
                color: #9f9;
                border: 1px solid #366;
                cursor: pointer;
                padding: 4px 6px;
                font: 12px monospace;
            }

            .toy-section-title {
                color: #9f9;
                border-top: 1px solid #244;
                margin-top: 8px;
                padding-top: 4px;
            }

            #toy-rank,
            #toy-history {
                margin: 4px 0 0;
                padding-left: 18px;
            }

            #toy-rank li,
            #toy-history li {
                margin: 2px 0;
                word-break: break-all;
            }

            #toy-status {
                min-height: 14px;
                color: #fa8;
            }

            #th07-prac {
                position: fixed;
                z-index: 9999;
                width: 360px;
                max-height: 80vh;
                overflow-y: auto;
                background: rgba(8, 12, 20, 0.94);
                color: #cfc;
                font: 12px/1.5 monospace;
                border: 1px solid #366;
                border-radius: 6px;
                padding: 8px 10px;
                box-sizing: border-box;
                display: none;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
            }

            .prac-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: bold;
                color: #9f9;
                margin-bottom: 6px;
            }

            #th07-prac-close {
                background: none;
                border: 1px solid #366;
                color: #9f9;
                cursor: pointer;
                font: 14px monospace;
                line-height: 1;
                padding: 2px 6px;
            }

            .prac-section {
                color: #9f9;
                border-top: 1px solid #244;
                margin-top: 8px;
                padding-top: 4px;
            }

            .prac-row {
                display: flex;
                align-items: center;
                gap: 6px;
                margin: 6px 0;
            }

            .prac-row label {
                width: 52px;
                color: #9f9;
                flex: none;
            }

            .prac-row select,
            .prac-row input {
                background: #000;
                color: #0f0;
                border: 1px solid #366;
                font: 12px monospace;
                padding: 2px 4px;
                box-sizing: border-box;
            }

            .prac-row select {
                flex: 1;
            }

            .prac-row input[type="number"] {
                width: 64px;
            }

            .prac-row button {
                background: #123;
                color: #9f9;
                border: 1px solid #366;
                cursor: pointer;
                padding: 3px 6px;
                font: 12px monospace;
            }

            #prac-status {
                min-height: 14px;
                color: #fa8;
                margin-top: 4px;
            }

            #hint {
                position: fixed;
                bottom: 8px;
                left: 0;
                right: 0;
                text-align: center;
                font: 12px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
                color: #555;
                pointer-events: none;
            }
            @media (pointer: coarse) {
                #hint {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="loader">
            <div class="ld-box">
                <div class="ld-title">東方妖々夢</div>
                <div class="ld-sub">Perfect Cherry Blossom</div>
                <div class="ld-bar busy"><div id="ld-fill"></div></div>

        <div id="toy-panel" style="display:none">

        <script>
            // ---- Loading screen ----------------------------------------------------
            var loaderEl = document.getElementById("loader");
            var loader = {
                bar: loaderEl.querySelector(".ld-bar"),
                fill: document.getElementById("ld-fill"),
                step: document.getElementById("ld-step"),
                detail: document.getElementById("ld-detail"),
                note: document.getElementById("ld-note"),
                retry: document.getElementById("ld-retry"),
            };
            var mb = (bytes) => (bytes / 1048576).toFixed(1);
            // fraction in 0..1 fills the bar; null shows the sliding "busy" band.
            function showStep(text, fraction, detail) {
                if (loaderEl.classList.contains("error")) return;
                loader.step.textContent = text;
                loader.bar.classList.toggle("busy", fraction == null);
                loader.fill.style.width = fraction == null ? "" : (fraction * 100).toFixed(1) + "%";
                if (detail !== undefined) loader.detail.textContent = detail;
            }
            function showError(text) {
                showStep(text, 0, "");
                loaderEl.classList.add("error");
                loader.note.textContent =
                    "可能是网络中断。点下面的按钮重试，问题还在的话按 F12 看 Console 里的报错。";
                loader.retry.hidden = false;
            }

            // After the data is in, the game still has to start the engine, read the saves,
            // unpack th07.dat and load the title screen before it draws anything, so the
            // loading screen stays up until the first draw call instead of vanishing early.
            var firstFrameSeen = false;
            function onFirstFrame() {
                if (firstFrameSeen) return;
                firstFrameSeen = true;
                loaderEl.classList.add("gone");
                setTimeout(() => {
                    loaderEl.style.display = "none";
                }, 600);
            }
            // SDL creates the WebGL context inside wasm, so wrapping getContext is the way in.
            // It also asks for a low-latency context: `desynchronized` skips the browser's
            // compositor queue (the browser's version of turning vsync off to cut input lag),
            // and preserveDrawingBuffer stops the flicker that can bring.
            (function hookFirstFrame() {
                var getContext = HTMLCanvasElement.prototype.getContext;
                HTMLCanvasElement.prototype.getContext = function (type, attrs) {
                    if (/webgl/.test(type)) {
                        attrs = Object.assign({}, attrs, { desynchronized: true, preserveDrawingBuffer: true });
                    }
                    var gl = getContext.call(this, type, attrs);
                    if (gl && /webgl/.test(type) && !gl.__firstFrameHooked) {
                        gl.__firstFrameHooked = true;
                        ["drawArrays", "drawElements"].forEach((name) => {
                            var draw = gl[name];
                            gl[name] = function () {
                                onFirstFrame();
                                return draw.apply(this, arguments);
                            };
                        });
                    }
                    return gl;
                };
            })();

            // Download progress comes from the runtime's "Downloading data... (loaded/total)"
            // status texts; a 1 s timer turns it into a speed.
            var download = { loaded: 0, total: 0, done: false, lastLoaded: 0, lastTick: 0, speed: 0 };
            function showDownload() {
                var fraction = download.total ? Math.min(download.loaded / download.total, 1) : 0;
                var detail = `${mb(download.loaded)} / ${mb(download.total)} MB`;
                if (download.speed > 0) detail += ` · ${mb(download.speed)} MB/s`;
                showStep(`正在下载游戏数据 ${Math.floor(fraction * 100)}%`, fraction, detail);
            }
            var loaderTimer = setInterval(() => {
                if (firstFrameSeen) return clearInterval(loaderTimer);
                // --use-preload-cache: a later visit reads th07.data from IndexedDB instead.
                var cached = Module.preloadResults && Module.preloadResults["th07.data"];
                if (cached && cached.fromCache && !download.done) {
                    download.done = true;
                    showStep("正在从浏览器缓存读取游戏数据…", null, "");
                }
                if (!download.total || download.done) return;
                var now = performance.now();
                var recent = (download.loaded - download.lastLoaded) / ((now - download.lastTick) / 1000);
                download.speed = download.speed ? download.speed * 0.6 + recent * 0.4 : recent;
                download.lastLoaded = download.loaded;
                download.lastTick = now;
                showDownload();
            }, 1000);
            window.addEventListener("error", () => {
                if (!firstFrameSeen) showError("游戏启动出错");
            });
            window.addEventListener("unhandledrejection", () => {
                if (!firstFrameSeen) showError(download.done ? "游戏启动出错" : "游戏数据下载失败");
            });

            var Module = {
                preRun: [],
                onAbort: () => {
                    if (!firstFrameSeen) showError("游戏启动出错");
                },
                canvas: (() => {
                    var canvas = document.getElementById("canvas");

                    canvas.addEventListener(
                        "webglcontextlost",
                        (e) => {
                            alert(
                                "WebGL context lost. You will need to reload the page.",
                            );
                            e.preventDefault();
                        },
                        false,
                    );

                    return canvas;
                })(),
                setStatus: (text) => {
                    if (download.done) return;
                    var m = text.match(/\((\d+)\/(\d+)\)/);
                    if (!m) {
                        if (/Downloading/.test(text)) showStep("正在下载游戏数据…", 0, "");
                        return;
                    }
                    if (!download.total) {
                        download.lastTick = performance.now();
                        loader.note.textContent =
                            `首次打开需要下载约 ${Math.ceil(m[2] / 1048576)} MB 游戏数据，网速慢时要等一会儿，页面没有卡住。` +
                            "之后再打开会直接从浏览器缓存读取。";
                    }
                    download.loaded = +m[1];
                    download.total = +m[2];
                    if (download.loaded >= download.total) {
                        download.done = true;
                        showStep("正在启动引擎…", null, "");
                    } else {
                        showDownload();
                    }
                },
                onRuntimeInitialized: () => {
                    download.done = true;
                    showStep("正在读取存档…", null, "");
                    try {
                        FS.mkdir("/savesth07");
                    } catch (e) {
                        console.error(e);
                    }

                    FS.mount(IDBFS, { autoPersist: true }, "/savesth07");
                    FS.syncfs(true, function (e) {
                        if (e) {
                            console.error(e);
                            showError("读取存档失败");
                            return;
                        }
                        console.log("idbfs initialized successfully");
                        showStep("正在初始化游戏…", null, "");
                        if (Module.callMain) Module.callMain();
                    });
                },
            };

            // Make sure the canvas can receive keyboard input immediately.
            var canvas = document.getElementById("canvas");
            canvas.tabIndex = 0;
            canvas.addEventListener("pointerdown", () => canvas.focus());
            window.addEventListener("load", () => canvas.focus());

            // Stop the browser from stealing game keys (page scroll, quick
            // find, save dialog, etc.). The game polls SDL_GetKeyboardState,
            // so preventing default here keeps browser latency out of the loop.
            var gameKeys = new Set([
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                " ",
                "Home",
                "End",
                "PageUp",
                "PageDown",
                "Enter",
                "Escape",
                "z",
                "x",
                "q",
                "s",
                "d",
                "r",
                "Shift",
                "Control",
                "Numpad0",
                "Numpad1",
                "Numpad2",
                "Numpad3",
                "Numpad4",
                "Numpad5",
                "Numpad6",
                "Numpad7",
                "Numpad8",
                "Numpad9",
            ]);
            window.addEventListener(
                "keydown",
                (e) => {
                    var active = document.activeElement;
                    if (
                        active &&
                        (active.tagName === "INPUT" ||
                            active.tagName === "TEXTAREA" ||
                            active.isContentEditable)
                    ) {
                        return;
                    }
                    if (gameKeys.has(e.key) || e.code.startsWith("Arrow") || e.code.startsWith("Numpad")) {
                        e.preventDefault();
                    }
                },
                { passive: false },
            );
            window.addEventListener("beforeunload", (event) => {
                event.preventDefault();
                event.returnValue = true;
            });

            // Shift+Enter toggles browser fullscreen. Caught in the capture phase so it doesn't
            // reach the game as a keypress.
            window.addEventListener(
                "keydown",
                (e) => {
                    if (e.key !== "Enter" || !e.shiftKey) return;
                    e.preventDefault();
                    e.stopPropagation();
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen?.().catch(() => {});
                    } else {
                        document.exitFullscreen?.().catch(() => {});
                    }
                },
                true,
            );
        </script>

        <script>
            // Practice panel (F9): stage/warp/spell jumps plus run-state
            // adjustments, styled after thprac's practice menu.
            (function () {
                var panel = document.getElementById("th07-prac");
                var statusEl = document.getElementById("prac-status");
                var stageSel = document.getElementById("prac-stage");
                var warpSel = document.getElementById("prac-warp");
                var warpN = document.getElementById("prac-warp-n");
                var spellN = document.getElementById("prac-spell-n");
                var scoreInput = document.getElementById("prac-score");
                var lifeInput = document.getElementById("prac-life");
                var bombInput = document.getElementById("prac-bomb");
                var powerInput = document.getElementById("prac-power");

                function setStatus(text) {
                    statusEl.textContent = text;
                }

                function setOpen(show) {
                    panel.style.display = show ? "block" : "none";
                    if (show) {
                        refreshState();
                        if (Module && Module._ThDebugGetWaveCount) {
                            var wc = Module._ThDebugGetWaveCount();
                            if (wc > 0) warpN.max = wc;
                        }
                        scoreInput.focus();
                        scoreInput.select();
                        if (Module && Module._ThDebugSetPaused) Module._ThDebugSetPaused(1);
                    } else {
                        resumeGame();
                    }
                }

                function resumeGame() {
                    if (!Module) return;
                    if (Module._ThDebugSetPaused) Module._ThDebugSetPaused(0);
                    if (Module._ThDebugGetPaused) {
                        setTimeout(function () {
                            if (Module._ThDebugGetPaused()) {
                                Module._ThDebugSetPaused(0);
                            }
                        }, 600);
                    }
                }

                function runAfterResume(fn) {
                    if (Module && Module._ThDebugSetPaused) Module._ThDebugSetPaused(0);
                    // The game's unpause animation takes ~20 frames; wait for
                    // it to finish before restarting a stage, otherwise the
                    // pause-menu state can be left dangling and crash.
                    setTimeout(function () {
                        try {
                            fn();
                        } catch (e) {
                            setStatus("err: " + e);
                        }
                    }, 0);
                }

                function refreshState() {
                    if (!Module) return;
                    if (Module._ThDebugGetScore) scoreInput.value = Module._ThDebugGetScore();
                    if (Module._ThDebugGetLives) lifeInput.value = Module._ThDebugGetLives();
                    if (Module._ThDebugGetBombs) bombInput.value = Module._ThDebugGetBombs();
                    if (Module._ThDebugGetPower) powerInput.value = Module._ThDebugGetPower();
                }

                function enterStage() {
                    var n = parseInt(stageSel.value, 10) || 1;
                    runAfterResume(function () {
                        Module._ThDebugStage(n);
                        setStatus("enter Stage " + n);
                    });
                }

                function warp() {
                    var kind = warpSel.value;
                    var n = parseInt(warpN.value, 10) || 0;
                    if (kind === "start") {
                        var st = parseInt(stageSel.value, 10) || 1;
                        runAfterResume(function () {
                            Module._ThDebugStage(st);
                            setStatus("stage start " + st);
                        });
                    } else if (kind === "wave") {
                        runAfterResume(function () {
                            Module._ThDebugWave(n);
                            setStatus("wave " + n);
                        });
                    } else if (kind === "midboss") {
                        runAfterResume(function () {
                            Module._ThDebugMidboss();
                            setStatus("midboss");
                        });
                    } else if (kind === "boss") {
                        runAfterResume(function () {
                            Module._ThDebugFinalBoss();
                            setStatus("final boss");
                        });
                    } else if (kind === "frame") {
                        runAfterResume(function () {
                            Module._ThDebugFrame(n);
                            setStatus("frame " + n);
                        });
                    }
                }

                function applyFocusedField() {
                    var el = document.activeElement;
                    if (el === scoreInput) setScore();
                    else if (el === lifeInput) setLife();
                    else if (el === bombInput) setBomb();
                    else if (el === powerInput) setPower();
                    else if (el === spellN) jumpSpell();
                    else if (el === warpN) warp();
                }

                function jumpSpell() {
                    var n = parseInt(spellN.value, 10) || 1;
                    runAfterResume(function () {
                        var r = Module._ThDebugSpell(n);
                        var msg = r === 0 ? "ok" : r === -1 ? "no boss active" : r === -2 ? "no ECL loaded" : r === -3 ? "no such spell" : "?";
                        setStatus("spell " + n + " -> " + msg);
                    });
                }

                function finish() {
                    var s = parseInt(scoreInput.value, 10) || 0;
                    runAfterResume(function () {
                        Module._ThDebugFinish(s);
                        setStatus("finish score " + s);
                        setOpen(false);
                    });
                }

                function setScore() {
                    var v = parseInt(scoreInput.value, 10) || 0;
                    if (Module && Module._ThDebugSetScore) Module._ThDebugSetScore(v);
                    setStatus("score = " + v);
                }

                function setLife() {
                    var v = parseInt(lifeInput.value, 10) || 0;
                    if (Module && Module._ThDebugSetLives) Module._ThDebugSetLives(v);
                    setStatus("lives = " + v);
                }

                function setBomb() {
                    var v = parseInt(bombInput.value, 10) || 0;
                    if (Module && Module._ThDebugSetBombs) Module._ThDebugSetBombs(v);
                    setStatus("bombs = " + v);
                }

                function setPower() {
                    var v = parseInt(powerInput.value, 10) || 0;
                    if (Module && Module._ThDebugSetPower) Module._ThDebugSetPower(v);
                    setStatus("power = " + v);
                }

                document.getElementById("th07-prac-close").addEventListener("click", function (e) {
                    e.stopPropagation();
                    setOpen(false);
                });
                document.getElementById("prac-stage-btn").addEventListener("click", enterStage);
                document.getElementById("prac-warp-btn").addEventListener("click", warp);
                document.getElementById("prac-spell-btn").addEventListener("click", jumpSpell);
                document.getElementById("prac-finish-btn").addEventListener("click", finish);
                document.getElementById("prac-score-btn").addEventListener("click", setScore);
                document.getElementById("prac-life-btn").addEventListener("click", setLife);
                document.getElementById("prac-bomb-btn").addEventListener("click", setBomb);
                document.getElementById("prac-power-btn").addEventListener("click", setPower);
                panel.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

                panel.addEventListener(
                    "keydown",
                    function (e) {
                        if (e.key !== "Enter") return;
                        applyFocusedField();
                        setOpen(false);
                        e.preventDefault();
                        e.stopPropagation();
                    },
                    true
                );

                function handlePanelKey(e) {
                    if (panel.style.display !== "block") return;
                    if (e.type === "keydown" && e.key === "Enter") {
                        setOpen(false);
                        e.stopImmediatePropagation();
                        return;
                    }
                    if (e.key === "F9" || e.key === "Escape") return;
                    e.stopImmediatePropagation();
                }
                window.addEventListener("keydown", handlePanelKey, false);
                window.addEventListener("keypress", handlePanelKey, false);
                window.addEventListener("keyup", handlePanelKey, false);

                window.addEventListener("keydown", function (e) {
                    if (e.key === "F9") {
                        e.preventDefault();
                        setOpen(panel.style.display === "none");
                    } else if (e.key === "Escape" && panel.style.display === "block") {
                        e.preventDefault();
                        setOpen(false);
                    }
                });

                window.__th07Debug = {
                    finish: function (n) { runAfterResume(function () { Module._ThDebugFinish(n | 0); }); },
                    stage: function (n) { runAfterResume(function () { Module._ThDebugStage(n | 0); }); },
                    timeline: function (n) { runAfterResume(function () { Module._ThDebugTimeline(n | 0); }); },
                    frame: function (n) { runAfterResume(function () { Module._ThDebugFrame(n | 0); }); },
                    spell: function (n) { runAfterResume(function () { var r = Module._ThDebugSpell(n | 0); setStatus("spell " + n + " -> " + r); }); },
                    midboss: function () { runAfterResume(function () { Module._ThDebugMidboss(); }); },
                    boss: function () { runAfterResume(function () { Module._ThDebugFinalBoss(); }); },
                    wave: function (n) { runAfterResume(function () { Module._ThDebugWave(n | 0); }); },
                    sub: function (n) { runAfterResume(function () { Module._ThDebugSub(n | 0); }); },
                    setScore: function (v) { if (v !== undefined) scoreInput.value = v; setScore(); },
                    setLives: function (v) { if (v !== undefined) lifeInput.value = v; setLife(); },
                    setBombs: function (v) { if (v !== undefined) bombInput.value = v; setBomb(); },
                    setPower: function (v) { if (v !== undefined) powerInput.value = v; setPower(); },
                    open: function () { setOpen(true); },
                    close: function () { setOpen(false); },
                    help: function () { setStatus("jump: stage/wave/midboss/boss/frame/spell; adjust: score/lives/bombs/power"); },
                };
            })();
        </script>

        <script>
            (function () {
                var panel = document.getElementById("toy-panel");
                var summaryEl = document.getElementById("toy-run-summary");
                var statusEl = document.getElementById("toy-status");
                var rankEl = document.getElementById("toy-rank");
                var historyEl = document.getElementById("toy-history");
                var uploadBtn = document.getElementById("toy-upload-btn");
                var imageBtn = document.getElementById("toy-image-btn");
                var closeBtn = document.getElementById("toy-panel-close");
                var lastRun = null;

                var DIFFS = ["Easy", "Normal", "Hard", "Lunatic", "Extra", "Phantasm"];
                var CHARS = ["ReimuA", "ReimuB", "MarisaA", "MarisaB", "SakuyaA", "SakuyaB"];
                var TYPES = { 1: "Clear", 2: "GameOver" };

                function fmtScore(n) {
                    return n == null ? "-" : Number(n).toLocaleString("en-US");
                }

                function withTimeout(promise, ms, fallback) {
                    return Promise.race([
                        promise,
                        new Promise(function (resolve) {
                            setTimeout(function () { resolve(fallback); }, ms);
                        }),
                    ]);
                }

                function layout() {
                    var canvas = document.getElementById("canvas");
                    var vw = window.innerWidth;
                    var vh = window.innerHeight;
                    var cw = canvas.width || 640;
                    var ch = canvas.height || 480;
                    var scale = Math.min(vw / cw, vh / ch);
                    var w = cw * scale;
                    var h = ch * scale;
                    var x = (vw - w) / 2;
                    var y = (vh - h) / 2;
                    var pw = Math.min(320, Math.max(220, w - 24));
                    panel.style.width = pw + "px";
                    var left = x + w - pw - 10;
                    if (left < x + 10) left = x + 10;
                    panel.style.left = Math.round(left) + "px";
                    panel.style.top = Math.round(y + 10) + "px";
                    panel.style.maxHeight = Math.round(h - 20) + "px";
                }

                function renderSummary(run) {
                    summaryEl.textContent =
                        "Score " + fmtScore(run.s) +
                        "  " + (TYPES[run.t] || run.t) +
                        "  Stage " + run.st +
                        "  " + (DIFFS[run.df] || run.df) +
                        "  " + (CHARS[run.c] || run.c) +
                        (run.stp != null ? "/" + run.stp : "") +
                        (run.pd ? "  Pointdevice" : "");
                }

                function setStatus(text) {
                    statusEl.textContent = text;
                }

                async function renderRank() {
                    rankEl.textContent = "";
                    if (!window.ToyBridge) return;
                    var list = await withTimeout(ToyBridge.getRank(1, "all", 10), 5000, []);
                    if (!list || !list.length) {
                        var li = document.createElement("li");
                        li.textContent = "暂无榜单数据（或当前环境无 Toy SDK）";
                        rankEl.appendChild(li);
                        return;
                    }
                    list.forEach(function (item) {
                        var li = document.createElement("li");
                        li.textContent =
                            "#" + item.rank +
                            " " + (item.nickname || "?") +
                            "  " + fmtScore(item.score * 1000);
                        rankEl.appendChild(li);
                    });
                }

                async function renderHistory() {
                    historyEl.textContent = "";
                    if (!window.ToyBridge) return;
                    var list = await withTimeout(ToyBridge.getHistory(), 5000, []);
                    if (!list || !list.length) {
                        var li = document.createElement("li");
                        li.textContent = "暂无历史记录";
                        historyEl.appendChild(li);
                        return;
                    }
                    list.slice(0, 20).forEach(function (h) {
                        var li = document.createElement("li");
                        li.textContent =
                            (h.d || "??") + " " +
                            (TYPES[h.t] || h.t) +
                            " St" + h.st +
                            " " + fmtScore(h.s) +
                            (h.pd ? " PD" : "");
                        historyEl.appendChild(li);
                    });
                }

                async function refresh() {
                    await renderRank();
                    await renderHistory();
                }

                async function upload() {
                    setStatus("授权中…");
                    var user = null;
                    try {
                        user = await ToyBridge.getUser();
                    } catch (e) {}
                    if (!user) {
                        setStatus("未授权或当前环境无 Toy SDK");
                        return;
                    }
                    setStatus("上传中…");
                    var res = await ToyBridge.submitLastScore(1, 1000);
                    setStatus(res ? "成绩已上传（board 1）" : "上传失败");
                    renderRank();
                }

                function saveImage() {
                    var c = document.createElement("canvas");
                    c.width = 640;
                    c.height = 480;
                    var g = c.getContext("2d");
                    g.fillStyle = "#000";
                    g.fillRect(0, 0, 640, 480);
                    g.fillStyle = "#0f0";
                    g.font = "20px monospace";
                    g.fillText("Touhou 7 - Perfect Cherry Blossom", 24, 44);
                    g.font = "16px monospace";
                    var run = lastRun || {};
                    g.fillText("Score: " + fmtScore(run.s), 24, 90);
                    g.fillText("Stage: " + run.st, 24, 116);
                    g.fillText("Difficulty: " + (DIFFS[run.df] || run.df), 24, 142);
                    g.fillText(
                        "Character: " + (CHARS[run.c] || run.c) +
                        (run.stp != null ? "/" + run.stp : ""),
                        24,
                        168
                    );
                    g.fillText("Date: " + (run.d || new Date().toISOString().slice(0, 10)), 24, 194);
                    if (!window.ToyBridge) {
                        setStatus("当前环境无 Toy SDK");
                        return;
                    }
                    ToyBridge.shareImage(c.toDataURL()).then(function (mode) {
                        setStatus(mode === "album" ? "已保存到相册" : "已开始下载战绩图");
                    });
                }

                function show(run) {
                    lastRun = run;
                    // Pointdevice runs have unlimited retries, so they are kept off the leaderboard.
                    uploadBtn.disabled = !!run.pd;
                    uploadBtn.textContent = run.pd ? "Pointdevice 成绩不上榜" : "授权并上传成绩";
                    panel.style.display = "block";
                    layout();
                    try {
                        renderSummary(run);
                    } catch (e) {
                        summaryEl.textContent = "summary render error";
                    }
                    setStatus("");
                    refresh().catch(function () {});
                }

                function hide() {
                    panel.style.display = "none";
                }

                closeBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    hide();
                });
                uploadBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    upload();
                });
                imageBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    saveImage();
                });
                panel.addEventListener("pointerdown", function (e) {
                    e.stopPropagation();
                });
                window.addEventListener("resize", layout);
                window.addEventListener("orientationchange", layout);

                window.__th07ToyShowResult = show;
                window.__th07ToyHideResult = hide;
            })();
        </script>

        {{{ SCRIPT }}}
    </body>
