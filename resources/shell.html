<!doctype html>
<html>
    <head>
        <title>東方妖々夢　〜 Perfect Cherry Blossom</title>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <script src="https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
        <script src="toy-bridge.js"></script>
        <style>
            #progress {
                height: 20px;
                width: 300px;
                padding-left: 0;
                padding-right: 0;
                margin-left: auto;
                margin-right: auto;
                display: block;
                padding: 0;
                margin: auto;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
            }

            .canvas {
                padding-left: 0;
                padding-right: 0;
                margin-left: auto;
                margin-right: auto;
                display: block;
                padding: 0;
                margin: auto;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                object-fit: contain;
                width: 100vw;
                height: 100vh;
            }

            #toy-panel {
                position: fixed;
                z-index: 9998;
                width: 320px;
                max-height: 70vh;
                overflow-y: auto;
                background: rgba(8, 12, 20, 0.92);
                color: #cfc;
                font: 12px/1.5 monospace;
                border: 1px solid #366;
                border-radius: 6px;
                padding: 8px 10px;
                box-sizing: border-box;
                display: none;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
            }

            .toy-panel-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: bold;
                color: #9f9;
                margin-bottom: 6px;
            }

            #toy-panel-close {
                background: none;
                border: 1px solid #366;
                color: #9f9;
                cursor: pointer;
                font: 14px monospace;
                line-height: 1;
                padding: 2px 6px;
            }

            .toy-actions {
                display: flex;
                gap: 6px;
                margin: 6px 0;
            }

            .toy-actions button {
                background: #123;
                color: #9f9;
                border: 1px solid #366;
                cursor: pointer;
                padding: 4px 6px;
                font: 12px monospace;
            }

            .toy-section-title {
                color: #9f9;
                border-top: 1px solid #244;
                margin-top: 8px;
                padding-top: 4px;
            }

            #toy-rank,
            #toy-history {
                margin: 4px 0 0;
                padding-left: 18px;
            }

            #toy-rank li,
            #toy-history li {
                margin: 2px 0;
                word-break: break-all;
            }

            #toy-status {
                min-height: 14px;
                color: #fa8;
            }

            #th07-prac {
                position: fixed;
                z-index: 9999;
                width: 360px;
                max-height: 80vh;
                overflow-y: auto;
                background: rgba(8, 12, 20, 0.94);
                color: #cfc;
                font: 12px/1.5 monospace;
                border: 1px solid #366;
                border-radius: 6px;
                padding: 8px 10px;
                box-sizing: border-box;
                display: none;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
            }

            .prac-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: bold;
                color: #9f9;
                margin-bottom: 6px;
            }

            #th07-prac-close {
                background: none;
                border: 1px solid #366;
                color: #9f9;
                cursor: pointer;
                font: 14px monospace;
                line-height: 1;
                padding: 2px 6px;
            }

            .prac-section {
                color: #9f9;
                border-top: 1px solid #244;
                margin-top: 8px;
                padding-top: 4px;
            }

            .prac-row {
                display: flex;
                align-items: center;
                gap: 6px;
                margin: 6px 0;
            }

            .prac-row label {
                width: 52px;
                color: #9f9;
                flex: none;
            }

            .prac-row select,
            .prac-row input {
                background: #000;
                color: #0f0;
                border: 1px solid #366;
                font: 12px monospace;
                padding: 2px 4px;
                box-sizing: border-box;
            }

            .prac-row select {
                flex: 1;
            }

            .prac-row input[type="number"] {
                width: 64px;
            }

            .prac-row button {
                background: #123;
                color: #9f9;
                border: 1px solid #366;
                cursor: pointer;
                padding: 3px 6px;
                font: 12px monospace;
            }

            #prac-status {
                min-height: 14px;
                color: #fa8;
                margin-top: 4px;
            }
        </style>
    </head>
    <body>
        <progress value="0" max="100" id="progress"></progress>

        <canvas
            id="canvas"
            class="canvas"
            oncontextmenu="event.preventDefault()"
        ></canvas>
        <div id="th07-prac" style="display:none">
            <div class="prac-header">
                <span>练习面板（F9）</span>
                <button id="th07-prac-close" type="button" title="关闭">×</button>
            </div>
            <div class="prac-section">跳转</div>
            <div class="prac-row">
                <label>关卡</label>
                <select id="prac-stage">
                    <option value="1">Stage 1</option>
                    <option value="2">Stage 2</option>
                    <option value="3">Stage 3</option>
                    <option value="4">Stage 4</option>
                    <option value="5">Stage 5</option>
                    <option value="6">Stage 6</option>
                    <option value="7">Stage 7</option>
                    <option value="8">Stage 8</option>
                </select>
                <button id="prac-stage-btn" type="button">进入</button>
            </div>
            <div class="prac-row">
                <label>位置</label>
                <select id="prac-warp">
                    <option value="start">道中起点</option>
                    <option value="wave">第 n 波</option>
                    <option value="midboss">中 Boss</option>
                    <option value="boss">最终 Boss</option>
                    <option value="timeline">指定 timeline</option>
                </select>
                <input id="prac-warp-n" type="number" min="0" value="1" />
                <button id="prac-warp-btn" type="button">跳转</button>
            </div>
            <div class="prac-row">
                <label>符卡</label>
                <input id="prac-spell-n" type="number" min="1" value="1" />
                <button id="prac-spell-btn" type="button">跳符卡</button>
                <button id="prac-finish-btn" type="button">直接结算</button>
            </div>
            <div class="prac-section">调整</div>
            <div class="prac-row">
                <label>分数</label>
                <input id="prac-score" type="number" min="0" value="0" />
                <button id="prac-score-btn" type="button">设置</button>
            </div>
            <div class="prac-row">
                <label>残机</label>
                <input id="prac-life" type="number" min="0" max="8" value="2" />
                <button id="prac-life-btn" type="button">设置</button>
            </div>
            <div class="prac-row">
                <label>雷</label>
                <input id="prac-bomb" type="number" min="0" max="8" value="3" />
                <button id="prac-bomb-btn" type="button">设置</button>
            </div>
            <div class="prac-row">
                <label>火力</label>
                <input id="prac-power" type="number" min="0" max="128" value="0" />
                <button id="prac-power-btn" type="button">设置</button>
            </div>
            <div id="prac-status"></div>
        </div>
        <div id="toy-panel" style="display:none">
            <div class="toy-panel-header">
                <span>Toy 社区</span>
                <button id="toy-panel-close" type="button" title="关闭">×</button>
            </div>
            <div id="toy-run-summary"></div>
            <div class="toy-actions">
                <button id="toy-upload-btn" type="button">授权并上传成绩</button>
                <button id="toy-image-btn" type="button">保存战绩图</button>
            </div>
            <div id="toy-status"></div>
            <div class="toy-section-title">排行榜（board 1 · 千分位）</div>
            <ol id="toy-rank"></ol>
            <div class="toy-section-title">最近战绩</div>
            <ul id="toy-history"></ul>
        </div>
        <script>
            var progressElement = document.getElementById("progress");
            var Module = {
                preRun: [],
                canvas: (() => {
                    var canvas = document.getElementById("canvas");

                    canvas.addEventListener(
                        "webglcontextlost",
                        (e) => {
                            alert(
                                "WebGL context lost. You will need to reload the page.",
                            );
                            e.preventDefault();
                        },
                        false,
                    );

                    return canvas;
                })(),
                setStatus: (text) => {
                    if (!Module.setStatus.last)
                        Module.setStatus.last = { time: Date.now(), text: "" };
                    if (text === Module.setStatus.last.text) return;
                    var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                    var now = Date.now();
                    if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
                    Module.setStatus.last.time = now;
                    Module.setStatus.last.text = text;
                    if (m) {
                        text = m[1];
                        progressElement.value = parseInt(m[2]) * 100;
                        progressElement.max = parseInt(m[4]) * 100;
                        progressElement.hidden = false;
                    } else {
                        progressElement.value = null;
                        progressElement.max = null;
                        progressElement.hidden = true;
                    }
                },
                onRuntimeInitialized: () => {
                    try {
                        FS.mkdir("/savesth07");
                    } catch (e) {
                        console.error(e);
                    }

                    FS.mount(IDBFS, { autoPersist: true }, "/savesth07");
                    FS.syncfs(true, function (e) {
                        if (e) {
                            console.error(e);
                            return;
                        }
                        console.log("idbfs initialized successfully");
                        if (Module.callMain) Module.callMain();
                    });
                },
            };

            // Make sure the canvas can receive keyboard input immediately.
            var canvas = document.getElementById("canvas");
            canvas.tabIndex = 0;
            canvas.addEventListener("pointerdown", () => canvas.focus());
            window.addEventListener("load", () => canvas.focus());

            // Stop the browser from stealing game keys (page scroll, quick
            // find, save dialog, etc.). The game polls SDL_GetKeyboardState,
            // so preventing default here keeps browser latency out of the loop.
            var gameKeys = new Set([
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                " ",
                "Home",
                "End",
                "PageUp",
                "PageDown",
                "Enter",
                "Escape",
                "z",
                "x",
                "q",
                "s",
                "d",
                "r",
                "Shift",
                "Control",
                "Numpad0",
                "Numpad1",
                "Numpad2",
                "Numpad3",
                "Numpad4",
                "Numpad5",
                "Numpad6",
                "Numpad7",
                "Numpad8",
                "Numpad9",
            ]);
            window.addEventListener(
                "keydown",
                (e) => {
                    var active = document.activeElement;
                    if (
                        active &&
                        (active.tagName === "INPUT" ||
                            active.tagName === "TEXTAREA" ||
                            active.isContentEditable)
                    ) {
                        return;
                    }
                    if (gameKeys.has(e.key) || e.code.startsWith("Arrow") || e.code.startsWith("Numpad")) {
                        e.preventDefault();
                    }
                },
                { passive: false },
            );
            window.addEventListener("beforeunload", (event) => {
                event.preventDefault();
                event.returnValue = true;
            });
        </script>

        <script>
            // Practice panel (F9): stage/warp/spell jumps plus run-state
            // adjustments, styled after thprac's practice menu.
            (function () {
                var panel = document.getElementById("th07-prac");
                var statusEl = document.getElementById("prac-status");
                var stageSel = document.getElementById("prac-stage");
                var warpSel = document.getElementById("prac-warp");
                var warpN = document.getElementById("prac-warp-n");
                var spellN = document.getElementById("prac-spell-n");
                var scoreInput = document.getElementById("prac-score");
                var lifeInput = document.getElementById("prac-life");
                var bombInput = document.getElementById("prac-bomb");
                var powerInput = document.getElementById("prac-power");

                function setStatus(text) {
                    statusEl.textContent = text;
                }

                function setOpen(show) {
                    panel.style.display = show ? "block" : "none";
                    if (show) {
                        refreshState();
                        if (Module && Module._ThDebugSetPaused) Module._ThDebugSetPaused(1);
                    } else {
                        if (Module && Module._ThDebugSetPaused) Module._ThDebugSetPaused(0);
                    }
                }

                function refreshState() {
                    if (!Module) return;
                    if (Module._ThDebugGetScore) scoreInput.value = Module._ThDebugGetScore();
                    if (Module._ThDebugGetLives) lifeInput.value = Module._ThDebugGetLives();
                    if (Module._ThDebugGetBombs) bombInput.value = Module._ThDebugGetBombs();
                    if (Module._ThDebugGetPower) powerInput.value = Module._ThDebugGetPower();
                }

                function call(fn, okText) {
                    try {
                        var r = fn();
                        setStatus(okText + (r != null ? " (" + r + ")" : ""));
                    } catch (e) {
                        setStatus("err: " + e);
                    }
                }

                function enterStage() {
                    var n = parseInt(stageSel.value, 10) || 1;
                    call(function () { Module._ThDebugStage(n); }, "进入 Stage " + n);
                }

                function warp() {
                    var kind = warpSel.value;
                    var n = parseInt(warpN.value, 10) || 0;
                    if (kind === "start") {
                        var st = parseInt(stageSel.value, 10) || 1;
                        call(function () { Module._ThDebugStage(st); }, "道中起点 Stage " + st);
                    } else if (kind === "wave") {
                        call(function () { Module._ThDebugWave(n); }, "第 " + n + " 波");
                    } else if (kind === "midboss") {
                        call(function () { Module._ThDebugMidboss(); }, "中 Boss");
                    } else if (kind === "boss") {
                        call(function () { Module._ThDebugFinalBoss(); }, "最终 Boss");
                    } else if (kind === "timeline") {
                        call(function () { Module._ThDebugTimeline(n); }, "timeline " + n);
                    }
                }

                function jumpSpell() {
                    var n = parseInt(spellN.value, 10) || 1;
                    var r = Module && Module._ThDebugSpell ? Module._ThDebugSpell(n) : null;
                    var msg = r === 0 ? "ok" : r === -1 ? "no boss active" : r === -2 ? "no ECL loaded" : r === -3 ? "no such spell" : "?";
                    setStatus("spell " + n + " -> " + msg);
                }

                function finish() {
                    var s = parseInt(scoreInput.value, 10) || 0;
                    call(function () { Module._ThDebugFinish(s); }, "finish score " + s);
                }

                function setScore() {
                    var v = parseInt(scoreInput.value, 10) || 0;
                    call(function () { Module._ThDebugSetScore(v); }, "score = " + v);
                }

                function setLife() {
                    var v = parseInt(lifeInput.value, 10) || 0;
                    call(function () { Module._ThDebugSetLives(v); }, "lives = " + v);
                }

                function setBomb() {
                    var v = parseInt(bombInput.value, 10) || 0;
                    call(function () { Module._ThDebugSetBombs(v); }, "bombs = " + v);
                }

                function setPower() {
                    var v = parseInt(powerInput.value, 10) || 0;
                    call(function () { Module._ThDebugSetPower(v); }, "power = " + v);
                }

                document.getElementById("th07-prac-close").addEventListener("click", function (e) {
                    e.stopPropagation();
                    setOpen(false);
                });
                document.getElementById("prac-stage-btn").addEventListener("click", enterStage);
                document.getElementById("prac-warp-btn").addEventListener("click", warp);
                document.getElementById("prac-spell-btn").addEventListener("click", jumpSpell);
                document.getElementById("prac-finish-btn").addEventListener("click", finish);
                document.getElementById("prac-score-btn").addEventListener("click", setScore);
                document.getElementById("prac-life-btn").addEventListener("click", setLife);
                document.getElementById("prac-bomb-btn").addEventListener("click", setBomb);
                document.getElementById("prac-power-btn").addEventListener("click", setPower);
                panel.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

                window.addEventListener("keydown", function (e) {
                    if (e.key === "F9") {
                        e.preventDefault();
                        setOpen(panel.style.display === "none");
                    } else if (e.key === "Escape" && panel.style.display === "block") {
                        e.preventDefault();
                        setOpen(false);
                    }
                });

                window.__th07Debug = {
                    finish: function (n) {
                        if (Module && Module._ThDebugFinish) Module._ThDebugFinish(n | 0);
                    },
                    stage: function (n) {
                        if (Module && Module._ThDebugStage) Module._ThDebugStage(n | 0);
                    },
                    timeline: function (n) {
                        if (Module && Module._ThDebugTimeline) Module._ThDebugTimeline(n | 0);
                    },
                    spell: function (n) {
                        if (Module && Module._ThDebugSpell) return Module._ThDebugSpell(n | 0);
                    },
                    midboss: function () {
                        if (Module && Module._ThDebugMidboss) Module._ThDebugMidboss();
                    },
                    boss: function () {
                        if (Module && Module._ThDebugFinalBoss) Module._ThDebugFinalBoss();
                    },
                    wave: function (n) {
                        if (Module && Module._ThDebugWave) Module._ThDebugWave(n | 0);
                    },
                    sub: function (n) {
                        if (Module && Module._ThDebugSub) Module._ThDebugSub(n | 0);
                    },
                    setScore: function (v) {
                        if (v !== undefined) scoreInput.value = v;
                        setScore();
                    },
                    setLives: function (v) {
                        if (v !== undefined) lifeInput.value = v;
                        setLife();
                    },
                    setBombs: function (v) {
                        if (v !== undefined) bombInput.value = v;
                        setBomb();
                    },
                    setPower: function (v) {
                        if (v !== undefined) powerInput.value = v;
                        setPower();
                    },
                    open: function () { setOpen(true); },
                    close: function () { setOpen(false); },
                    help: function () {
                        setStatus("jump: stage/wave/midboss/boss/timeline/spell; adjust: score/lives/bombs/power");
                    },
                };
            })();
        </script>

        <script>
            (function () {
                var panel = document.getElementById("toy-panel");
                var summaryEl = document.getElementById("toy-run-summary");
                var statusEl = document.getElementById("toy-status");
                var rankEl = document.getElementById("toy-rank");
                var historyEl = document.getElementById("toy-history");
                var uploadBtn = document.getElementById("toy-upload-btn");
                var imageBtn = document.getElementById("toy-image-btn");
                var closeBtn = document.getElementById("toy-panel-close");
                var lastRun = null;

                var DIFFS = ["Easy", "Normal", "Hard", "Lunatic", "Extra", "Phantasm"];
                var CHARS = ["ReimuA", "ReimuB", "MarisaA", "MarisaB", "SakuyaA", "SakuyaB"];
                var TYPES = { 1: "Clear", 2: "GameOver" };

                function fmtScore(n) {
                    return n == null ? "-" : Number(n).toLocaleString("en-US");
                }

                function withTimeout(promise, ms, fallback) {
                    return Promise.race([
                        promise,
                        new Promise(function (resolve) {
                            setTimeout(function () { resolve(fallback); }, ms);
                        }),
                    ]);
                }

                function layout() {
                    var canvas = document.getElementById("canvas");
                    var vw = window.innerWidth;
                    var vh = window.innerHeight;
                    var cw = canvas.width || 640;
                    var ch = canvas.height || 480;
                    var scale = Math.min(vw / cw, vh / ch);
                    var w = cw * scale;
                    var h = ch * scale;
                    var x = (vw - w) / 2;
                    var y = (vh - h) / 2;
                    var pw = Math.min(320, Math.max(220, w - 24));
                    panel.style.width = pw + "px";
                    var left = x + w - pw - 10;
                    if (left < x + 10) left = x + 10;
                    panel.style.left = Math.round(left) + "px";
                    panel.style.top = Math.round(y + 10) + "px";
                    panel.style.maxHeight = Math.round(h - 20) + "px";
                }

                function renderSummary(run) {
                    summaryEl.textContent =
                        "Score " + fmtScore(run.s) +
                        "  " + (TYPES[run.t] || run.t) +
                        "  Stage " + run.st +
                        "  " + (DIFFS[run.df] || run.df) +
                        "  " + (CHARS[run.c] || run.c) +
                        (run.stp != null ? "/" + run.stp : "");
                }

                function setStatus(text) {
                    statusEl.textContent = text;
                }

                async function renderRank() {
                    rankEl.textContent = "";
                    if (!window.ToyBridge) return;
                    var list = await withTimeout(ToyBridge.getRank(1, "all", 10), 5000, []);
                    if (!list || !list.length) {
                        var li = document.createElement("li");
                        li.textContent = "暂无榜单数据（或当前环境无 Toy SDK）";
                        rankEl.appendChild(li);
                        return;
                    }
                    list.forEach(function (item) {
                        var li = document.createElement("li");
                        li.textContent =
                            "#" + item.rank +
                            " " + (item.nickname || "?") +
                            "  " + fmtScore(item.score * 1000);
                        rankEl.appendChild(li);
                    });
                }

                async function renderHistory() {
                    historyEl.textContent = "";
                    if (!window.ToyBridge) return;
                    var list = await withTimeout(ToyBridge.getHistory(), 5000, []);
                    if (!list || !list.length) {
                        var li = document.createElement("li");
                        li.textContent = "暂无历史记录";
                        historyEl.appendChild(li);
                        return;
                    }
                    list.slice(0, 20).forEach(function (h) {
                        var li = document.createElement("li");
                        li.textContent =
                            (h.d || "??") + " " +
                            (TYPES[h.t] || h.t) +
                            " St" + h.st +
                            " " + fmtScore(h.s);
                        historyEl.appendChild(li);
                    });
                }

                async function refresh() {
                    await renderRank();
                    await renderHistory();
                }

                async function upload() {
                    setStatus("授权中…");
                    var user = null;
                    try {
                        user = await ToyBridge.getUser();
                    } catch (e) {}
                    if (!user) {
                        setStatus("未授权或当前环境无 Toy SDK");
                        return;
                    }
                    setStatus("上传中…");
                    var res = await ToyBridge.submitLastScore(1, 1000);
                    setStatus(res ? "成绩已上传（board 1）" : "上传失败");
                    renderRank();
                }

                function saveImage() {
                    var c = document.createElement("canvas");
                    c.width = 640;
                    c.height = 480;
                    var g = c.getContext("2d");
                    g.fillStyle = "#000";
                    g.fillRect(0, 0, 640, 480);
                    g.fillStyle = "#0f0";
                    g.font = "20px monospace";
                    g.fillText("Touhou 7 - Perfect Cherry Blossom", 24, 44);
                    g.font = "16px monospace";
                    var run = lastRun || {};
                    g.fillText("Score: " + fmtScore(run.s), 24, 90);
                    g.fillText("Stage: " + run.st, 24, 116);
                    g.fillText("Difficulty: " + (DIFFS[run.df] || run.df), 24, 142);
                    g.fillText(
                        "Character: " + (CHARS[run.c] || run.c) +
                        (run.stp != null ? "/" + run.stp : ""),
                        24,
                        168
                    );
                    g.fillText("Date: " + (run.d || new Date().toISOString().slice(0, 10)), 24, 194);
                    if (!window.ToyBridge) {
                        setStatus("当前环境无 Toy SDK");
                        return;
                    }
                    ToyBridge.shareImage(c.toDataURL()).then(function (mode) {
                        setStatus(mode === "album" ? "已保存到相册" : "已开始下载战绩图");
                    });
                }

                function show(run) {
                    lastRun = run;
                    panel.style.display = "block";
                    layout();
                    try {
                        renderSummary(run);
                    } catch (e) {
                        summaryEl.textContent = "summary render error";
                    }
                    setStatus("");
                    refresh().catch(function () {});
                }

                function hide() {
                    panel.style.display = "none";
                }

                closeBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    hide();
                });
                uploadBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    upload();
                });
                imageBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    saveImage();
                });
                panel.addEventListener("pointerdown", function (e) {
                    e.stopPropagation();
                });
                window.addEventListener("resize", layout);
                window.addEventListener("orientationchange", layout);

                window.__th07ToyShowResult = show;
                window.__th07ToyHideResult = hide;
            })();
        </script>

        {{{ SCRIPT }}}
    </body>
</html>
