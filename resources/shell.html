<!doctype html>
<html>
    <head>
        <title>東方妖々夢　〜 Perfect Cherry Blossom</title>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <script src="https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
        <script src="toy-bridge.js"></script>
        <style>
            #progress {
                height: 20px;
                width: 300px;
                padding-left: 0;
                padding-right: 0;
                margin-left: auto;
                margin-right: auto;
                display: block;
                padding: 0;
                margin: auto;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
            }

            .canvas {
                padding-left: 0;
                padding-right: 0;
                margin-left: auto;
                margin-right: auto;
                display: block;
                padding: 0;
                margin: auto;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                object-fit: contain;
                width: 100vw;
                height: 100vh;
            }

            #toy-panel {
                position: fixed;
                z-index: 9998;
                width: 320px;
                max-height: 70vh;
                overflow-y: auto;
                background: rgba(8, 12, 20, 0.92);
                color: #cfc;
                font: 12px/1.5 monospace;
                border: 1px solid #366;
                border-radius: 6px;
                padding: 8px 10px;
                box-sizing: border-box;
                display: none;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
            }

            .toy-panel-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: bold;
                color: #9f9;
                margin-bottom: 6px;
            }

            #toy-panel-close {
                background: none;
                border: 1px solid #366;
                color: #9f9;
                cursor: pointer;
                font: 14px monospace;
                line-height: 1;
                padding: 2px 6px;
            }

            .toy-actions {
                display: flex;
                gap: 6px;
                margin: 6px 0;
            }

            .toy-actions button {
                background: #123;
                color: #9f9;
                border: 1px solid #366;
                cursor: pointer;
                padding: 4px 6px;
                font: 12px monospace;
            }

            .toy-section-title {
                color: #9f9;
                border-top: 1px solid #244;
                margin-top: 8px;
                padding-top: 4px;
            }

            #toy-rank,
            #toy-history {
                margin: 4px 0 0;
                padding-left: 18px;
            }

            #toy-rank li,
            #toy-history li {
                margin: 2px 0;
                word-break: break-all;
            }

            #toy-status {
                min-height: 14px;
                color: #fa8;
            }
        </style>
    </head>
    <body>
        <progress value="0" max="100" id="progress"></progress>

        <canvas
            id="canvas"
            class="canvas"
            oncontextmenu="event.preventDefault()"
        ></canvas>
        <div
            id="th07-debug"
            style="display:none;position:fixed;left:8px;bottom:8px;z-index:9999;background:rgba(0,0,0,0.85);color:#0f0;font:12px monospace;padding:8px;border-radius:4px;"
        >
            <div id="th07-debug-out"></div>
            <input
                id="th07-debug-input"
                style="width:280px;background:#000;color:#0f0;border:1px solid #0f0;"
                placeholder="debug: finish / stage / timeline / boss / help (F9)"
            />
        </div>
        <div id="toy-panel" style="display:none">
            <div class="toy-panel-header">
                <span>Toy 社区</span>
                <button id="toy-panel-close" type="button" title="关闭">×</button>
            </div>
            <div id="toy-run-summary"></div>
            <div class="toy-actions">
                <button id="toy-upload-btn" type="button">授权并上传成绩</button>
                <button id="toy-image-btn" type="button">保存战绩图</button>
            </div>
            <div id="toy-status"></div>
            <div class="toy-section-title">排行榜（board 1 · 千分位）</div>
            <ol id="toy-rank"></ol>
            <div class="toy-section-title">最近战绩</div>
            <ul id="toy-history"></ul>
        </div>
        <script>
            var progressElement = document.getElementById("progress");
            var Module = {
                preRun: [],
                canvas: (() => {
                    var canvas = document.getElementById("canvas");

                    canvas.addEventListener(
                        "webglcontextlost",
                        (e) => {
                            alert(
                                "WebGL context lost. You will need to reload the page.",
                            );
                            e.preventDefault();
                        },
                        false,
                    );

                    return canvas;
                })(),
                setStatus: (text) => {
                    if (!Module.setStatus.last)
                        Module.setStatus.last = { time: Date.now(), text: "" };
                    if (text === Module.setStatus.last.text) return;
                    var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                    var now = Date.now();
                    if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
                    Module.setStatus.last.time = now;
                    Module.setStatus.last.text = text;
                    if (m) {
                        text = m[1];
                        progressElement.value = parseInt(m[2]) * 100;
                        progressElement.max = parseInt(m[4]) * 100;
                        progressElement.hidden = false;
                    } else {
                        progressElement.value = null;
                        progressElement.max = null;
                        progressElement.hidden = true;
                    }
                },
                onRuntimeInitialized: () => {
                    try {
                        FS.mkdir("/savesth07");
                    } catch (e) {
                        console.error(e);
                    }

                    FS.mount(IDBFS, { autoPersist: true }, "/savesth07");
                    FS.syncfs(true, function (e) {
                        if (e) {
                            console.error(e);
                            return;
                        }
                        console.log("idbfs initialized successfully");
                        if (Module.callMain) Module.callMain();
                    });
                },
            };

            // Make sure the canvas can receive keyboard input immediately.
            var canvas = document.getElementById("canvas");
            canvas.tabIndex = 0;
            canvas.addEventListener("pointerdown", () => canvas.focus());
            window.addEventListener("load", () => canvas.focus());

            // Stop the browser from stealing game keys (page scroll, quick
            // find, save dialog, etc.). The game polls SDL_GetKeyboardState,
            // so preventing default here keeps browser latency out of the loop.
            var gameKeys = new Set([
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                " ",
                "Home",
                "End",
                "PageUp",
                "PageDown",
                "Enter",
                "Escape",
                "z",
                "x",
                "q",
                "s",
                "d",
                "r",
                "Shift",
                "Control",
                "Numpad0",
                "Numpad1",
                "Numpad2",
                "Numpad3",
                "Numpad4",
                "Numpad5",
                "Numpad6",
                "Numpad7",
                "Numpad8",
                "Numpad9",
            ]);
            window.addEventListener(
                "keydown",
                (e) => {
                    var active = document.activeElement;
                    if (
                        active &&
                        (active.tagName === "INPUT" ||
                            active.tagName === "TEXTAREA" ||
                            active.isContentEditable)
                    ) {
                        return;
                    }
                    if (gameKeys.has(e.key) || e.code.startsWith("Arrow") || e.code.startsWith("Numpad")) {
                        e.preventDefault();
                    }
                },
                { passive: false },
            );
            window.addEventListener("beforeunload", (event) => {
                event.preventDefault();
                event.returnValue = true;
            });
        </script>

        <script>
            // Debug backdoor console (F9). Commands:
            //   finish [score]    - jump to the result screen with the given score
            //   stage <1-8>       - enter a stage (keeps score/lives/bombs)
            //   spell <n>         - jump to the n-th spellcard (auto-jumps to boss)
            //   midboss           - restart current stage at the midboss entrance
            //   boss              - restart current stage at the final boss entrance
            //   wave <n>          - restart current stage at the n-th enemy wave
            //   timeline <n>      - restart current stage at ECL timeline n
            //   sub <id>          - raw: call ECL sub id on the active boss
            //   help              - list commands
            (function () {
                var box = document.getElementById("th07-debug");
                var out = document.getElementById("th07-debug-out");
                var input = document.getElementById("th07-debug-input");

                function log(text) {
                    out.textContent = text;
                }

                function setOpen(show) {
                    box.style.display = show ? "block" : "none";
                    if (show) {
                        input.focus();
                        if (Module && Module._ThDebugSetPaused) Module._ThDebugSetPaused(1);
                    } else {
                        if (Module && Module._ThDebugSetPaused) Module._ThDebugSetPaused(0);
                    }
                }

                function run(cmd) {
                    var parts = cmd.trim().split(/\s+/);
                    var c = parts[0];
                    var n = parts.length > 1 ? parseInt(parts[1], 10) : 0;
                    if (isNaN(n)) n = 0;

                    if (c === "finish") {
                        if (Module && Module._ThDebugFinish) {
                            Module._ThDebugFinish(n | 0);
                            log("finish -> result screen (score " + (n | 0) + ")");
                            setOpen(false);
                        } else {
                            log("ThDebugFinish not exported yet");
                        }
                    } else if (c === "stage") {
                        if (Module && Module._ThDebugStage) {
                            Module._ThDebugStage(n | 0);
                            log("jump to stage " + (n | 0));
                        }
                    } else if (c === "timeline") {
                        if (Module && Module._ThDebugTimeline) {
                            Module._ThDebugTimeline(n | 0);
                            log("run timeline " + (n | 0));
                        }
                    } else if (c === "spell") {
                        if (Module && Module._ThDebugSpell) {
                            var r = Module._ThDebugSpell(n | 0);
                            var msg = ["ok", "no boss active", "no ECL loaded", "no such spell"][-r] || "?";
                            log("spell " + (n | 0) + " -> " + msg);
                        }
                    } else if (c === "midboss") {
                        if (Module && Module._ThDebugMidboss) {
                            Module._ThDebugMidboss();
                            log("midboss timeline run");
                        }
                    } else if (c === "boss") {
                        if (Module && Module._ThDebugFinalBoss) {
                            Module._ThDebugFinalBoss();
                            log("final boss timeline run");
                        }
                    } else if (c === "wave") {
                        if (Module && Module._ThDebugWave) {
                            Module._ThDebugWave(n | 0);
                            log("run wave " + (n | 0));
                        }
                    } else if (c === "sub") {
                        if (Module && Module._ThDebugSub) {
                            Module._ThDebugSub(n | 0);
                            log("call boss sub " + (n | 0));
                        }
                    } else if (c === "help") {
                        log("commands: finish [score], stage <1-8>, spell <n>, midboss, boss, wave <n>, timeline <n>, sub <id>, help");
                    } else {
                        log("unknown: " + c + " (try help)");
                    }
                }

                // Intercept every key on window (capture phase) while the
                // console is open. This runs before SDL's canvas listener and
                // before the input's native handling, so SDL never sees the
                // keys and we control insertion ourselves.
                function handleDebugKey(e) {
                    if (box.style.display !== "block") return;
                    e.stopImmediatePropagation();
                    e.preventDefault();
                    if (e.type === "keydown") {
                        if (e.key === "Enter") {
                            run(input.value);
                            input.value = "";
                        } else if (e.key === "Escape" || e.key === "F9") {
                            setOpen(false);
                        } else if (e.key === "Backspace") {
                            input.value = input.value.slice(0, -1);
                        } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
                            input.value += e.key;
                            input.scrollLeft = input.scrollWidth;
                        }
                    }
                }
                window.addEventListener("keydown", handleDebugKey, true);
                window.addEventListener("keypress", handleDebugKey, true);
                window.addEventListener("keyup", handleDebugKey, true);

                window.addEventListener("keydown", function (e) {
                    if (e.key === "F9") {
                        e.preventDefault();
                        setOpen(box.style.display === "none");
                    }
                });

                input.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") {
                        run(input.value);
                        input.value = "";
                    } else if (e.key === "Escape") {
                        setOpen(false);
                    }
                });

                window.__th07Debug = {
                    finish: function (n) {
                        if (Module && Module._ThDebugFinish) Module._ThDebugFinish(n | 0);
                    },
                    stage: function (n) {
                        if (Module && Module._ThDebugStage) Module._ThDebugStage(n | 0);
                    },
                    timeline: function (n) {
                        if (Module && Module._ThDebugTimeline) Module._ThDebugTimeline(n | 0);
                    },
                    spell: function (n) {
                        if (Module && Module._ThDebugSpell) return Module._ThDebugSpell(n | 0);
                    },
                    midboss: function () {
                        if (Module && Module._ThDebugMidboss) Module._ThDebugMidboss();
                    },
                    boss: function () {
                        if (Module && Module._ThDebugFinalBoss) Module._ThDebugFinalBoss();
                    },
                    wave: function (n) {
                        if (Module && Module._ThDebugWave) Module._ThDebugWave(n | 0);
                    },
                    sub: function (n) {
                        if (Module && Module._ThDebugSub) Module._ThDebugSub(n | 0);
                    },
                    help: log,
                };
            })();
        </script>

        <script>
            (function () {
                var panel = document.getElementById("toy-panel");
                var summaryEl = document.getElementById("toy-run-summary");
                var statusEl = document.getElementById("toy-status");
                var rankEl = document.getElementById("toy-rank");
                var historyEl = document.getElementById("toy-history");
                var uploadBtn = document.getElementById("toy-upload-btn");
                var imageBtn = document.getElementById("toy-image-btn");
                var closeBtn = document.getElementById("toy-panel-close");
                var lastRun = null;

                var DIFFS = ["Easy", "Normal", "Hard", "Lunatic", "Extra", "Phantasm"];
                var CHARS = ["ReimuA", "ReimuB", "MarisaA", "MarisaB", "SakuyaA", "SakuyaB"];
                var TYPES = { 1: "Clear", 2: "GameOver" };

                function fmtScore(n) {
                    return n == null ? "-" : Number(n).toLocaleString("en-US");
                }

                function layout() {
                    var canvas = document.getElementById("canvas");
                    var vw = window.innerWidth;
                    var vh = window.innerHeight;
                    var cw = canvas.width || 640;
                    var ch = canvas.height || 480;
                    var scale = Math.min(vw / cw, vh / ch);
                    var w = cw * scale;
                    var h = ch * scale;
                    var x = (vw - w) / 2;
                    var y = (vh - h) / 2;
                    var pw = Math.min(320, Math.max(220, w - 24));
                    panel.style.width = pw + "px";
                    var left = x + w - pw - 10;
                    if (left < x + 10) left = x + 10;
                    panel.style.left = Math.round(left) + "px";
                    panel.style.top = Math.round(y + 10) + "px";
                    panel.style.maxHeight = Math.round(h - 20) + "px";
                }

                function renderSummary(run) {
                    summaryEl.textContent =
                        "Score " + fmtScore(run.s) +
                        "  " + (TYPES[run.t] || run.t) +
                        "  Stage " + run.st +
                        "  " + (DIFFS[run.df] || run.df) +
                        "  " + (CHARS[run.c] || run.c) +
                        (run.stp != null ? "/" + run.stp : "");
                }

                function setStatus(text) {
                    statusEl.textContent = text;
                }

                async function renderRank() {
                    rankEl.textContent = "";
                    if (!window.ToyBridge) return;
                    var list = await ToyBridge.getRank(1, "all", 10);
                    if (!list || !list.length) {
                        var li = document.createElement("li");
                        li.textContent = "暂无榜单数据（或当前环境无 Toy SDK）";
                        rankEl.appendChild(li);
                        return;
                    }
                    list.forEach(function (item) {
                        var li = document.createElement("li");
                        li.textContent =
                            "#" + item.rank +
                            " " + (item.nickname || "?") +
                            "  " + fmtScore(item.score * 1000);
                        rankEl.appendChild(li);
                    });
                }

                async function renderHistory() {
                    historyEl.textContent = "";
                    if (!window.ToyBridge) return;
                    var list = await ToyBridge.getHistory();
                    if (!list || !list.length) {
                        var li = document.createElement("li");
                        li.textContent = "暂无历史记录";
                        historyEl.appendChild(li);
                        return;
                    }
                    list.slice(0, 20).forEach(function (h) {
                        var li = document.createElement("li");
                        li.textContent =
                            (h.d || "??") + " " +
                            (TYPES[h.t] || h.t) +
                            " St" + h.st +
                            " " + fmtScore(h.s);
                        historyEl.appendChild(li);
                    });
                }

                async function refresh() {
                    await renderRank();
                    await renderHistory();
                }

                async function upload() {
                    setStatus("授权中…");
                    var user = null;
                    try {
                        user = await ToyBridge.getUser();
                    } catch (e) {}
                    if (!user) {
                        setStatus("未授权或当前环境无 Toy SDK");
                        return;
                    }
                    setStatus("上传中…");
                    var res = await ToyBridge.submitLastScore(1, 1000);
                    setStatus(res ? "成绩已上传（board 1）" : "上传失败");
                    renderRank();
                }

                function saveImage() {
                    var c = document.createElement("canvas");
                    c.width = 640;
                    c.height = 480;
                    var g = c.getContext("2d");
                    g.fillStyle = "#000";
                    g.fillRect(0, 0, 640, 480);
                    g.fillStyle = "#0f0";
                    g.font = "20px monospace";
                    g.fillText("Touhou 7 - Perfect Cherry Blossom", 24, 44);
                    g.font = "16px monospace";
                    var run = lastRun || {};
                    g.fillText("Score: " + fmtScore(run.s), 24, 90);
                    g.fillText("Stage: " + run.st, 24, 116);
                    g.fillText("Difficulty: " + (DIFFS[run.df] || run.df), 24, 142);
                    g.fillText(
                        "Character: " + (CHARS[run.c] || run.c) +
                        (run.stp != null ? "/" + run.stp : ""),
                        24,
                        168
                    );
                    g.fillText("Date: " + (run.d || new Date().toISOString().slice(0, 10)), 24, 194);
                    if (!window.ToyBridge) {
                        setStatus("当前环境无 Toy SDK");
                        return;
                    }
                    ToyBridge.shareImage(c.toDataURL()).then(function (mode) {
                        setStatus(mode === "album" ? "已保存到相册" : "已开始下载战绩图");
                    });
                }

                function show(run) {
                    lastRun = run;
                    renderSummary(run);
                    layout();
                    panel.style.display = "block";
                    setStatus("");
                    refresh();
                }

                function hide() {
                    panel.style.display = "none";
                }

                closeBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    hide();
                });
                uploadBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    upload();
                });
                imageBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    saveImage();
                });
                panel.addEventListener("pointerdown", function (e) {
                    e.stopPropagation();
                });
                window.addEventListener("resize", layout);
                window.addEventListener("orientationchange", layout);

                window.__th07ToyShowResult = show;
                window.__th07ToyHideResult = hide;
            })();
        </script>

        {{{ SCRIPT }}}
    </body>
</html>
